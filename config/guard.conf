# FJGuard 配置（改完执行 ctl.sh reload 或重启生效）
# 0=关闭该层，1=开启

# 破坏性指令扫描间隔（秒，支持小数；越小越灵敏但越耗电）
PROC_INTERVAL=0.6
# 完整性巡检间隔（秒）
INTEGRITY_INTERVAL=90
# 用 chattr +i 把运行时副本/基线锁成不可删改（f2fs/ext4 有效）
IMMUTABLE=1
# 监控 /sdcard 上的用户数据删除（照片/下载等）
BLOCK_SDCARD=1
# 拦截对这些系统包执行 pm clear
BLOCK_PM_CLEAR=1
# /data 剩余空间低于该值时预警（MB）
FREE_WARN_MB=1024
# 单个日志文件上限（KB）
LOG_MAX_KB=512
# 拦截/修复时是否发系统通知
NOTIFY=1
